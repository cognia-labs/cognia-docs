name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the preserved full-mode changed-file coverage gate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    name: Independent docs and Pages runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DOCS_SITE_URL: https://docs.example.org
      NEXT_PUBLIC_WEB_SITE_URL: https://example.org
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify the actual Cloudflare Pages runtime
        run: |
          pnpm preview:pages > .cache/pages-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true; cat .cache/pages-preview.log' EXIT
          node scripts/check-pages-preview.mjs
      - name: Package the static export
        run: tar -czf .cache/docs-static.tar.gz -C out .
      - uses: actions/upload-artifact@v7
        with:
          name: static-docs
          path: .cache/docs-static.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-browser-results
          path: |
            playwright-report/
            test-results/
            .cache/screenshots/
            .cache/pages-preview.log
          if-no-files-found: ignore
          retention-days: 7
  changed-coverage:
    name: Full-mode changed-file coverage
    if: github.event_name == 'pull_request' || inputs.full_validation == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retain the 90 percent full-mode changed-file gate
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COVERAGE_FULL: ${{ inputs.full_validation == true || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [ -z "$COVERAGE_BASE_SHA" ]; then export COVERAGE_BASE_SHA="$(git rev-parse HEAD^)"; fi
          pnpm coverage:changed
